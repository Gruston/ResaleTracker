<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resale Tracker – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#1E1C1A; --ink2:#5F5A54; --line:#E6E1DA;
  --accent:#2E6B5E; --accentSoft:#E3EFEB; --warn:#B4541F; --warnSoft:#FBEDE4;
  --c-cost:#8C8780; --c-profit:#2E6B5E; --c-post:#D9893F; --c-prot:#5B6FB5; --c-ad:#C9B458;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E5DF;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
@media (min-width:760px){.phone{max-width:820px}}
.proto-banner{background:var(--ink);color:#fff;font-size:12px;padding:6px 16px calc(6px);padding-top:calc(6px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px}
.proto-banner b{font-weight:600}
header.top{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font-size:28px;font-weight:700;margin:0;flex:1;letter-spacing:-.5px}
header.top h2{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border:none;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}
.iconbtn:active{background:var(--accentSoft)}
.back{color:var(--accent);background:none;border:none;font-size:16px;display:flex;align-items:center;gap:2px;min-height:44px;cursor:pointer;padding:0 4px}
main{flex:1;padding:0 16px 110px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.section-title{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:2px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;cursor:pointer;min-height:56px}
.alert .dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:14px}
.alert .t{flex:1}
.alert .t b{display:block;font-weight:600;font-size:15px}
.alert .t span{font-size:13px;color:var(--ink2)}
.dot.warn{background:var(--warnSoft);color:var(--warn)}
.dot.ok{background:var(--accentSoft);color:var(--accent)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer;min-height:60px}
.row:last-child{border-bottom:none}
.row:active{background:#F3F0EB}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{font-size:13px;color:var(--ink2)}
.row .right{text-align:right;font-size:14px;font-weight:600;flex-shrink:0}
.row .right small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.thumb{width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:#EEEAE4;color:var(--ink2);white-space:nowrap}
.pill.listed{background:#E6ECF7;color:#3B4F8F}
.pill.sold{background:var(--warnSoft);color:var(--warn)}
.pill.posted{background:var(--accentSoft);color:var(--accent)}
.pill.draft{background:#EEEAE4;color:#5F5A54}
.pill.returned{background:#F4E6F0;color:#8A3A73}
.pill.faulty{background:#F6E3E3;color:#9B2C2C}
.search{display:flex;align-items:center;gap:8px;background:#ECE8E2;border-radius:12px;padding:0 12px;min-height:44px;margin-bottom:10px}
.search input{flex:1;border:none;background:none;font:inherit;font-size:16px;outline:none;min-height:44px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;min-height:36px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:#ECE8E2;border-radius:10px;padding:3px;margin-bottom:12px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;border-radius:8px;min-height:36px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-bottom:10px}
.btn.secondary{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.small{min-height:40px;font-size:14px;width:auto;padding:0 14px;display:inline-flex}
.sim{font-size:11px;font-weight:600;color:var(--warn);background:var(--warnSoft);padding:2px 6px;border-radius:6px;margin-left:6px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:500;text-align:right}
.kv.total span{font-weight:700;color:var(--ink)}
.kv.neg span:last-child{color:var(--ink2)}
.photo{height:220px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;margin-bottom:12px;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo .count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:3px 8px;border-radius:99px;font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:none;padding:0 12px;min-height:44px;font-size:14px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.moneybar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.moneybar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars .b{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.bars .track{background:#EFEBE5;border-radius:6px;height:16px;overflow:hidden}
.bars .fill{background:var(--accent);height:100%;border-radius:6px}
.bars .b span:last-child{text-align:right;font-weight:600}
.vbars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.vbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--ink2)}
.vbars .col .bar{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 0 0}
.vbars .col .val{font-weight:600;color:var(--ink);margin-bottom:4px;font-size:11px}
.vbars .col .lab{margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--ink2);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right}
table.t tr:last-child td{border-bottom:none}
.heat td.h{text-align:center;font-weight:600;border-radius:6px}
.insight{background:var(--accentSoft);border-radius:var(--radius);padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.45}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.field textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.progress{height:6px;background:#EFEBE5;border-radius:99px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--accent)}
nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
@media (min-width:760px){nav.tabbar{max-width:820px}}
nav.tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;min-height:56px;font-size:11px;color:#8A847C;cursor:pointer}
nav.tabbar button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px, calc(50% - 215px + 16px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;border:none;box-shadow:0 6px 16px rgba(46,107,94,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6}
@media (min-width:760px){.fab{right:max(16px, calc(50% - 410px + 16px))}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:5px;background:#D5CFC7;border-radius:99px;margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px;font-size:15px;cursor:pointer;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.muted{color:var(--ink2);font-size:13px}
.layout-toggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.layout-toggle .seg{margin:0;flex:0 0 auto}
.longsec h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;color:var(--ink2);letter-spacing:.4px}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scen .card{padding:12px;margin:0}
.scen .card h5{margin:0 0 6px;font-size:13px}
.scen .big{font-size:20px;font-weight:700}
.scen .best{border:2px solid var(--accent)}
.scen input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:16px}
.scen .ln{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;margin:3px 0}
.scen .ln b{color:var(--ink);font-weight:600}
@media (max-width:520px){.scen{grid-template-columns:1fr}}
</style>
</head>

<script>

const palette = ['#7C9A8E','#B98A6B','#8A8FB5','#C2A267','#A3787F','#6F8FA6','#9B9A6A','#B07D9C'];

const skuPrefix = (dept, type) => DEPT_CODE[dept] + (DB.codes[type] || 'X');
const newSku = (dept, type) => { const p = skuPrefix(dept, type); const n = Math.max(0, ...DB.items.filter(i => i.sku.startsWith(p + '-')).map(i => Number(i.sku.split('-')[1]))) + 1; return p + '-' + String(n).padStart(3, '0'); };

const ICON = {

  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2"/>'
};
const ic = (n, s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

  const people = ['Cat','Max'];
  const codes = {Dress:'D', Top:'T', Shirt:'S', Cardigan:'C', Jumper:'J', Jacket:'K', Coat:'O', Skirt:'R', Pants:'P', Jeans:'N', Shoes:'F', Bag:'B', Accessory:'A', Romper:'Y', Playsuit:'U'};
  const storage = {WD:'Rack A · dresses, by colour', WT:'Shelf 2 · tops', WC:'Shelf 2 · knits', WJ:'Shelf 2 · knits', WR:'Shelf 3 · skirts & pants', WP:'Shelf 3 · skirts & pants', WK:'Rack B · jackets & coats', WO:'Rack B · jackets & coats', WF:'Box S1 · shoes', WB:'Box B1 · bags & accessories', WA:'Box B1 · bags & accessories', W:"Rack C · other women's", M:"Shelf 5 · men's", K:"Shelf 6 · kids'"};

    ['Summer sundress','Country Road','Women','Dress','10','Blue stripe','Salvos Newtown',14,'2026-10-25',55,'2026-11-08',52,'sold'],

function itemSections(it) {
  const sec = {};
  sec.Details = `<div class="card">${[['SKU', it.sku],['Stored at', storageFor(it.sku)],['Brand', it.brand],['Department', it.dept],['Item type', it.type],['Size', it.size]].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div><div class="card"><div class="muted" style="margin-bottom:6px">Listing description</div><div style="font-size:15px;line-height:1.45">${esc(it.description)}</div></div>`;
  const trip = it.trip && DB.trips.find(t=>t.id===it.trip);
  sec.Purchase = `<div class="card">${[['Bought from', it.shop || '<span style="color:var(--warn)">Not recorded</span>'],['Date', trip ? fdate(trip.date) : '—'],['Cost', it.cost!=null ? $(it.cost) : '<span style="color:var(--warn)">Add cost</span>'],['Online order no.', it.orderNo || '—'],['Shopping trip', trip ? `<a href="#" data-action="trip" data-id="${trip.id}" style="color:var(--accent)">${esc(trip.shop)}, ${fdate(trip.date)}</a>` : '—']].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div>${it.cost==null?`<button class="btn" data-action="addcost" data-id="${it.id}">Add what you paid</button>`:''}`;
  sec.Listing = `<div class="card">${[['Status', `<span class="pill ${it.status}">${statusLabel(it.status)}</span>`],['Date listed', fdate(it.listed)],['First listing price', it.listPrice ? $(it.listPrice) : '—'],['Ad rate', it.adRate!=null ? it.adRate + '%' : '—'],['You get about', it.listPrice ? $(youGet(it.listPrice, it.adRate)) : '—'],['Buyer sees about', it.listPrice ? $(buyerSees(it.listPrice)) : '—'],...(it.sale ? [['Sold for', $(it.sale.price)],['Discount from first price', it.listPrice ? `${$(it.listPrice - it.sale.price)} (${Math.round(discountPct(it))}%)` : '—']] : []),['Days listed', it.listed ? (it.sale ? daysToSell(it) + ' (sold)' : days(it.listed, TODAY)) : '—'],['eBay listing', it.listed ? 'Linked in phase 2' : '—']].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}${it.listPrice?`<p class="muted" style="margin:8px 0 0">You get: your price minus the ad fee. Buyer sees: your price plus buyer protection and postage.</p>`:''}</div>${it.listPrice ? `<button class="btn secondary" data-action="whatif" data-id="${it.id}">${ic('calc',18)} Try pricing options</button>` : ''}`;
  if (it.sale) {
    const s = it.sale;
    const mates = s.combined ? DB.items.filter(x=>x!==it && x.sale && x.sale.orderNo===s.orderNo) : [];
    sec.Sale = `${s.combined ? `<div class="insight"><b>Combined order</b> with ${mates.map(m=>`<a href="#" data-action="item" data-id="${m.id}" style="color:var(--accent)">${m.sku} ${esc(m.brand)} ${esc(m.title)}</a>`).join(', ')}. The buyer paid ${$(s.orderTotal)} for the whole order; postage and buyer protection are split by item price so each item's profit is right.</div>` : ''}${moneyBreakdown(it)}<div class="card"><div class="kv"><span>Date sold</span><span>${fdate(s.date)} · ${daysToSell(it)} days</span></div><div class="kv"><span>eBay order no.</span><span>${s.orderNo}</span></div><div class="kv total"><span>${s.combined?'This item\'s share of order':'Order total (buyer paid)'}</span><span>${$(s.total)}</span></div><div class="kv neg"><span>− Buyer protection fee</span><span>${$(s.prot)}</span></div><div class="kv neg"><span>− Postage</span><span>${$(s.postage)}</span></div><div class="kv neg"><span>− Ad fee</span><span>${$(s.ad)}</span></div><div class="kv total"><span>eBay earnings</span><span>${$(earnings(it))}</span></div><div class="kv neg"><span>− What you paid</span><span>${$(it.cost||0)}</span></div><div class="kv total"><span>Your profit</span><span style="color:var(--accent)">${$(profit(it))}</span></div></div>${it.status==='returned'?`<div class="card" style="border-color:#E5C7DD"><b>Returned</b><div class="muted" style="margin-bottom:6px">${esc(it.returnNote||'')}</div><div class="kv"><span>Refund to buyer</span><span>${$(it.refund||0)}</span></div><div class="kv"><span>Came back</span><span>Awaiting decision</span></div><div class="grid2" style="margin-top:10px"><button class="btn secondary" style="margin:0" data-action="relist" data-id="${it.id}">Relist it</button><button class="btn secondary" style="margin:0;color:#9B2C2C" data-action="binreturn" data-id="${it.id}">Damaged, throw out</button></div></div>`:''}`;
    sec.Shipping = `<div class="card"><div class="kv"><span>Postage label</span><span>${$(s.postage)} via eBay</span></div><div class="kv"><span>Tracking no.</span><span>${it.tracking || '<span style="color:var(--warn)">Not posted yet</span>'}</span></div><div class="kv"><span>Postage receipt</span><span>${it.tracking ? 'From eBay' : '—'}</span></div></div>${!it.tracking ? `<button class="btn" data-action="post" data-id="${it.id}">Mark as posted</button>` : ''}`;
  } else {
    sec.Sale = `<div class="card muted">Not sold yet. In phase 2, sale details arrive from eBay automatically.</div>${it.status==='listed' ? `<button class="btn" data-action="marksold" data-id="${it.id}">Mark as sold (enter manually)</button>` : ''}`;
    sec.Shipping = `<div class="card muted">Shipping details appear once the item sells.</div>`;
  }
  return sec;
}
function vItem(id) {
  const it = DB.items.find(x=>x.id===id);
  const sec = itemSections(it);
  let h = header(it.sku);
  h += `<main><div class="photo" style="background:${colorFor(it.brand)}">${it.photo ? `<img src="${it.photo}" alt="">` : esc(it.brand)}<span class="count">Photo 1 of 4</span></div>`;
  h += `<div style="font-size:20px;font-weight:700;margin:0 2px">${esc(it.brand)} ${esc(it.title)}</div><div class="muted" style="margin:2px 2px 12px">${esc(it.dept)} · ${esc(it.type)} · Size ${esc(it.size)} · <b style="color:var(--ink)">${it.sku}</b> in ${esc(storageFor(it.sku))}</div>`;
  {
    h += `<div class="tabs">${Object.keys(sec).map(k=>`<button class="${S.itemTab===k?'on':''}" data-action="itab" data-t="${k}">${k}</button>`).join('')}</div>${sec[S.itemTab]}`;
  }
  return h + `</main>`;
}

function vAdd(p={}) {
  const types = ['Dress','Top','Shirt','Cardigan','Jumper','Jacket','Coat','Skirt','Pants','Jeans','Shoes','Bag','Accessory','Romper','Playsuit'];
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  let h = header('New item');
  h += `<main><label class="photo" style="background:#EFEBE5;color:var(--ink2);flex-direction:column;gap:6px;cursor:pointer;font-size:15px;font-weight:500" id="photobox">${ic('camera',30)}Add photos<input type="file" accept="image/*" id="photoin" style="display:none"></label>`;
  h += `<div class="card" style="background:var(--accentSoft);border-color:transparent"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>SKU</b> <span id="newsku">${newSku('Women', p.type||'Cardigan')}</span><div class="muted" id="newstore">Store in: ${esc(storageFor(newSku('Women', p.type||'Cardigan')))}</div></div>${p.cost!=null?`<div class="muted" style="text-align:right">From receipt<br><b style="color:var(--ink)">${esc(p.shop)} · ${$(p.cost)}</b></div>`:''}</div></div>`;
  h += `<div class="grid2"><div class="field"><label for="f-brand">Brand</label><input id="f-brand" value="${esc(p.brand||'')}" placeholder="e.g. Country Road"></div><div class="field"><label for="f-dept">Department</label>${sel('f-dept',['Women','Men','Kids'],'Women')}</div></div>`;
  h += `<div class="grid2"><div class="field"><label for="f-type">Item type</label>${sel('f-type',types,p.type||'Cardigan')}</div><div class="field"><label for="f-size">Size</label><input id="f-size" value="${esc(p.size||'')}" placeholder="e.g. 10, M, US 8"></div></div>`;
  h += `<div class="grid2"><div class="field"><label for="f-shop">Bought from</label>${sel('f-shop',[...DB.shops,'+ Add new shop'],p.shop||DB.shops[0])}</div><div class="field"><label for="f-cost">What you paid ($)</label><input id="f-cost" inputmode="decimal" value="${p.cost!=null?p.cost:''}"></div></div>`;
  h += `<button class="btn secondary" data-action="ai">${ic('spark',18)} Write listing with AI <span class="sim">Simulated</span></button>`;
  h += `<div class="field"><label for="f-title">eBay title <span class="muted" id="tcount"></span></label><input id="f-title" value="${esc(p.title||'')}" maxlength="80"></div><div class="field"><label for="f-desc">Description</label><textarea id="f-desc"></textarea></div><div id="pricehint"></div>`;
  h += `<div class="grid2"><div class="field"><label for="f-price">Your listing price ($)</label><input id="f-price" inputmode="decimal"></div><div class="field"><label for="f-ad">Ad rate (%)</label><input id="f-ad" inputmode="decimal" value="${DB.fees.adPct}"></div></div><div id="pricepreview"></div>`;
  h += `<div class="field"><label for="f-listed">Date listed</label><input id="f-listed" type="date" value="${TODAY}"></div>`;
  h += `<button class="btn" data-action="saveitem" data-trip="${p.trip||''}" data-line="${p.line??''}">Save item</button></main>`;
  return h;
}

// ---------- insights ----------
function groupBy(list, key) { const m = {}; list.forEach(i => { const k = typeof key === 'function' ? key(i) : i[key]; (m[k] = m[k] || []).push(i); }); return m; }
function bars(entries, fmt, max) { max = max || Math.max(...entries.map(e=>e[1]), 1); return `<div class="bars">${entries.map(([l,v,sub])=>`<div class="b"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${Math.max(v,0)/max*100}%"></div></div><span>${fmt(v)}${sub?`<br><small class="muted" style="font-weight:400">${sub}</small>`:''}</span></div>`).join('')}</div>`; }
const avg = (l, f) => l.length ? l.reduce((a,i)=>a+f(i),0)/l.length : 0;

function vInsights() {
  const tabs = ['Overview','What sells','Discounts','Shops & brands','Price bands','Stock'];
  let h = header('Insights', {large:true, right:`<button class="btn small" data-action="whatif">${ic('calc',18)} What-if</button>`});
  h += `<main><div class="seg">${tabs.map(t=>`<button class="${S.insTab===t?'on':''}" data-action="instab" data-t="${t}">${t}</button>`).join('')}</div>`;
  const sold = soldItems();
  if (S.insTab === 'Overview') {
    const rev = sold.reduce((a,i)=>a+i.sale.total,0), earn = sold.reduce((a,i)=>a+earnings(i),0), prof = sold.reduce((a,i)=>a+profit(i),0);
    h += totalsCard();
    h += `<div class="kpis"><div class="kpi"><div class="v">${$0(rev)}</div><div class="l">Buyers paid</div></div><div class="kpi"><div class="v">${$0(earn)}</div><div class="l">eBay earnings</div></div><div class="kpi"><div class="v">${$0(prof)}</div><div class="l">Profit</div></div></div>`;
    const months = ['2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11'];
    const pm = months.map(m => [mon(m+'-01'), sold.filter(i=>i.sale.date.startsWith(m)).reduce((a,i)=>a+profit(i),0)]);
    const mx = Math.max(...pm.map(x=>x[1]),1);
    h += `<div class="card"><div style="font-weight:600">Profit by month</div><div class="vbars">${pm.map(([l,v])=>`<div class="col"><div class="val">${$0(v)}</div><div class="bar" style="height:${Math.max(v,0)/mx*100}px"></div><div class="lab">${l}</div></div>`).join('')}</div></div>`;
    const lost = DB.items.filter(i=>i.status==='faulty'||i.status==='returned');
    h += `<div class="card"><div class="kv"><span>Items sold</span><span>${sold.length}</span></div><div class="kv"><span>Average days to sell</span><span>${Math.round(avg(sold, daysToSell))}</span></div><div class="kv"><span>Average buyer all-in price</span><span>${$(avg(sold, i=>i.sale.total))}</span></div><div class="kv"><span>Average profit per item</span><span>${$(avg(sold, profit))}</span></div><div class="kv"><span>Sold from your own wardrobe</span><span>${sold.filter(i=>i.shop==='My wardrobe').length} · ${$0(sold.filter(i=>i.shop==='My wardrobe').reduce((a,i)=>a+profit(i),0))} profit</span></div><div class="kv"><span>Returns and faulty</span><span>${lost.length} · ${$(lost.reduce((a,i)=>a+(i.cost||0),0))} cost</span></div></div>`;
  }
  if (S.insTab === 'What sells') {
    h += `<div class="chips">${['All','Women','Men','Kids'].map(d=>`<button class="chip ${S.dept===d?'on':''}" data-action="dept" data-d="${d}">${d}</button>`).join('')}</div>`;
    const list = sold.filter(i => S.dept==='All' || i.dept===S.dept);
    const byType = Object.entries(groupBy(list,'type')).map(([k,v])=>[k, v.length, `${$0(v.reduce((a,i)=>a+profit(i),0))} · ${Math.round(avg(v,daysToSell))}d`]).sort((a,b)=>b[1]-a[1]);
    const best = byType[0];
    if (best) h += `<div class="insight">Your best-selling item type${S.dept!=='All'?' in '+S.dept:''} is <b>${best[0]}</b>, with ${best[1]} sold.</div>`;
    h += `<div class="card"><div style="font-weight:600">Best-selling item types</div><div class="muted">Number sold · profit · avg days to sell</div>${byType.length?bars(byType, v=>v+' sold'):'<p class="muted">No sales yet.</p>'}</div>`;
    const depts = S.dept==='All' ? ['Women','Men','Kids'] : [S.dept];
    depts.forEach(d => { const dl = sold.filter(i=>i.dept===d); const bs = Object.entries(groupBy(dl,'size')).map(([k,v])=>[k, v.length]).sort((a,b)=>b[1]-a[1]); if (bs.length) h += `<div class="card"><div style="font-weight:600">Best-selling sizes · ${d}</div>${bars(bs, v=>v+' sold')}</div>`; });
    const months = ['2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11'];
    const types = [...new Set(list.map(i=>i.type))];
    const cnt = (t,m) => list.filter(i=>i.type===t && i.sale.date.startsWith(m)).length;
    const mx = Math.max(1, ...types.flatMap(t=>months.map(m=>cnt(t,m))));
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600">What sells when</div><div class="muted" style="margin-bottom:6px">Items sold by month · Winter Jun–Aug, Spring Sep–Nov</div><table class="t heat"><tr><th>Type</th>${months.map(m=>`<th class="n">${mon(m+'-01')}</th>`).join('')}</tr>${types.map(t=>`<tr><td>${t}</td>${months.map(m=>{const c=cnt(t,m);return `<td class="h" style="background:${c?`rgba(46,107,94,${0.15+0.6*c/mx})`:'transparent'};color:${c/mx>0.6?'#fff':'var(--ink)'}">${c||''}</td>`;}).join('')}</tr>`).join('')}</table></div>`;
  }
  if (S.insTab === 'Discounts') {
    const withList = sold.filter(i=>i.listPrice);
    const full = withList.filter(i=>i.sale.price >= i.listPrice);
    const avgDisc = avg(withList, discountPct);
    h += `<div class="kpis"><div class="kpi"><div class="v">${Math.round(avgDisc)}%</div><div class="l">Avg drop from first price</div></div><div class="kpi"><div class="v">${Math.round(full.length/withList.length*100)}%</div><div class="l">Sold at first price</div></div><div class="kpi"><div class="v">${avg(withList,i=>i.adRate).toFixed(1)}%</div><div class="l">Avg ad rate</div></div></div>`;
    h += `<div class="insight">On average you sell for <b>${Math.round(avgDisc)}% below</b> your first listing price. To get about $90, list at about <b>${$0(90/(1-avgDisc/100))}</b>.</div>`;
    const bt = Object.entries(groupBy(withList,'type')).map(([k,v])=>[k, v.length, avg(v,i=>i.listPrice), avg(v,i=>i.sale.price), avg(v,discountPct)]).sort((a,b)=>b[4]-a[4]);
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600;margin-bottom:6px">By item type</div><table class="t"><tr><th>Type</th><th class="n">Sold</th><th class="n">First price</th><th class="n">Sold for</th><th class="n">Drop</th></tr>${bt.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${$0(r[2])}</td><td class="n">${$0(r[3])}</td><td class="n">${Math.round(r[4])}%</td></tr>`).join('')}</table></div>`;
    const ar = Object.entries(groupBy(withList, i=>i.adRate>=5?'5%+':i.adRate+'%')).map(([k,v])=>[k, v.length, avg(v,daysToSell), avg(v,i=>i.sale.ad)]).sort((a,b)=>a[0].localeCompare(b[0]));
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600;margin-bottom:6px">Do higher ad rates sell faster?</div><table class="t"><tr><th>Ad rate</th><th class="n">Sold</th><th class="n">Avg days to sell</th><th class="n">Avg ad cost</th></tr>${ar.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${Math.round(r[2])}</td><td class="n">${$(r[3])}</td></tr>`).join('')}</table><p class="muted" style="margin:8px 0 0">Sample data is small. With real sales this shows whether a higher ad rate is worth it.</p></div>`;
  }
  if (S.insTab === 'Shops & brands') {
    const shopRows = DB.shops.filter(s=>s!=='My wardrobe').map(s => { const all = DB.items.filter(i=>i.shop===s); const sl = sold.filter(i=>i.shop===s); const left = all.filter(i=>['listed','draft'].includes(i.status)); const spent = all.reduce((a,i)=>a+(i.cost||0),0); const prof = sl.reduce((a,i)=>a+profit(i),0); return { s, n: all.length, sold: sl.length, thru: all.length ? sl.length/all.length*100 : 0, prof, per: spent ? prof/spent : 0, left: left.length, tied: left.reduce((a,i)=>a+(i.cost||0),0), days: avg(sl, daysToSell) }; });
    const byProfit = shopRows.slice().sort((a,b)=>b.prof-a.prof), byLeft = shopRows.slice().sort((a,b)=>b.left-a.left || b.tied-a.tied);
    h += `<div class="insight">Most profitable shop: <b>${byProfit[0].s}</b> (${$0(byProfit[0].prof)} profit, ${$(byProfit[0].per)} back per $1 spent).<br>Most unsold stock: <b>${byLeft[0].s}</b> (${byLeft[0].left} item${byLeft[0].left===1?'':'s'} unsold, ${$0(byLeft[0].tied)} tied up).</div>`;
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600">Is this shop worth going to?</div><div class="muted" style="margin-bottom:6px">Sell-through = share of items bought there that have sold</div><table class="t"><tr><th>Shop</th><th class="n">Bought</th><th class="n">Sell-through</th><th class="n">Profit</th><th class="n">Per $1</th><th class="n">Days</th></tr>${byProfit.map(r=>`<tr><td>${esc(r.s)}</td><td class="n">${r.n}</td><td class="n">${Math.round(r.thru)}%</td><td class="n">${$0(r.prof)}</td><td class="n">${$(r.per)}</td><td class="n">${r.sold?Math.round(r.days):'—'}</td></tr>`).join('')}</table></div>`;
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600;margin-bottom:6px">Unsold stock by shop</div>${bars(byLeft.map(r=>[r.s.replace(/^The /,'').split(' ')[0], r.left, $0(r.tied) + ' tied up']), v=>v + ' item' + (v===1?'':'s'))}</div>`;
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600;margin-bottom:6px">Best shopping trips</div><table class="t"><tr><th>Trip</th><th class="n">Spent</th><th class="n">Earned</th><th class="n">Left</th></tr>${DB.trips.map(t=>tripStats(t)).sort((a,b)=>b.net-a.net).map(r=>`<tr><td>${esc(r.t.shop.split(' ')[0])} · ${fdate(r.t.date).replace(' 2026','')}</td><td class="n">${$0(r.t.total)}</td><td class="n">${$0(r.earned)}</td><td class="n">${r.left}</td></tr>`).join('')}</table></div>`;
    const br = Object.entries(groupBy(sold,'brand')).map(([k,v])=>[k, v.length, avg(v,profit), avg(v,daysToSell), avg(v,i=>i.sale.total)]).sort((a,b)=>b[2]-a[2]);
    h += `<div class="card" style="overflow-x:auto"><div style="font-weight:600;margin-bottom:6px">Brands</div><table class="t"><tr><th>Brand</th><th class="n">Sold</th><th class="n">Avg profit</th><th class="n">Avg days</th><th class="n">Buyer paid</th></tr>${br.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${r[1]}</td><td class="n">${$0(r[2])}</td><td class="n">${Math.round(r[3])}</td><td class="n">${$0(r[4])}</td></tr>`).join('')}</table><p class="muted" style="margin:8px 0 0">"Buyer paid" is the average all-in total, a guide to what buyers will pay.</p></div>`;
  }
  if (S.insTab === 'Price bands') {
    const bands = [['Under $30',0,30],['$30–80',30,80],['$80–150',80,150],['Over $150',150,1e9]];
    const rows = bands.map(([l,lo,hi]) => { const v = sold.filter(i=>i.sale.price>=lo && i.sale.price<hi); const ap = avg(v,profit), ad = avg(v,daysToSell); return [l, v.length, ap, ad, ad ? ap/(ad/7) : 0]; });
    const best = rows.filter(r=>r[1]).sort((a,b)=>b[4]-a[4])[0];
    h += `<div class="insight">Profit per week listed is highest for <b>${best[0]}</b> items (${$(best[4])}/week). Cheaper items sell faster; expensive ones earn more each but tie up money longer.</div>`;
    h += `<div class="card" style="overflow-x:auto"><table class="t"><tr><th>Sale price</th><th class="n">Sold</th><th class="n">Avg profit</th><th class="n">Avg days</th><th class="n">Profit / week listed</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[1]?$0(r[2]):'—'}</td><td class="n">${r[1]?Math.round(r[3]):'—'}</td><td class="n">${r[1]?$(r[4]):'—'}</td></tr>`).join('')}</table></div><p class="muted" style="margin:0 4px">Profit per week listed = average profit ÷ weeks it took to sell. It compares how hard each price range works for you.</p>`;
  }
  if (S.insTab === 'Stock') {
    const listed = DB.items.filter(i=>i.status==='listed');
    const b = [['0–30 days',0,30],['31–90 days',31,90],['91–180 days',91,180],['Over 180 days',181,1e9]].map(([l,lo,hi])=>{ const v = listed.filter(i=>{const d=days(i.listed,TODAY);return d>=lo&&d<=hi;}); return [l, v.length, `${$0(v.reduce((a,i)=>a+(i.cost||0),0))} tied up`]; });
    h += `<div class="card"><div style="font-weight:600">Unsold stock by time listed</div>${bars(b, v=>v+' items')}</div>`;
    h += `<div class="section-title">Listed longest</div><div class="list">${listed.sort((a,b)=>a.listed.localeCompare(b.listed)).slice(0,5).map(itemRow).join('')}</div>`;
  }
  return h + `</main>`;
}

function vWhatIf(id) {
  const listed = DB.items.filter(i=>i.listPrice);
  const it = DB.items.find(x=>x.id===(id||S.whatIfItem)) || DB.items[0];
  S.whatIfItem = it.id;
  const f = DB.fees;
  const base = it.listPrice || 60;
  S.scen = S.scen && S.scen.item===it.id ? S.scen : { item:it.id, a:Math.round(base*0.95), b:Math.round(base*1.1), c:Math.round(base), flat:10 };
  const calc = (price, postCharged) => { const prot = f.protFixed + f.protPct/100*(price+postCharged); const ad = (it.adRate ?? f.adPct)/100*price; const total = price + postCharged + prot; const earn = total - prot - f.label - ad; return { total, prot, ad, earn, profit: earn - (it.cost||0) }; };
  const sc = [['Buyer pays postage', S.scen.a, f.label, 'a'], ['Free postage', S.scen.b, 0, 'b'], [`Flat $${S.scen.flat} postage`, S.scen.c, S.scen.flat, 'c']].map(([n,p,pc,k])=>({n,p,pc,k,...calc(p,pc)}));
  const best = sc.reduce((a,b)=>b.profit>a.profit?b:a);
  let h = header('Pricing what-if');
  h += `<main><div class="field"><label for="wi-item">Item</label><select id="wi-item">${listed.map(i=>`<option value="${i.id}" ${i.id===it.id?'selected':''}>${esc(i.brand+' '+i.title)} (cost ${i.cost!=null?$(i.cost):'?'})</option>`).join('')}</select></div>`;
  h += `<p class="muted" style="margin:0 2px 10px">Change the prices to compare. The postage label costs you ${$(f.label)} either way.</p><div class="scen">`;
  sc.forEach(s => { h += `<div class="card ${s===best?'best':''}"><h5>${s.n}</h5><label class="muted" style="font-size:12px">Item price</label><input data-scen="${s.k}" inputmode="decimal" value="${s.p}" aria-label="Item price for ${s.n}"><div class="ln"><span>Buyer pays all-in</span><b>${$(s.total)}</b></div><div class="ln"><span>Postage charged</span><b>${$(s.pc)}</b></div><div class="ln"><span>Protection + ad</span><b>${$(s.prot+s.ad)}</b></div><div class="ln"><span>eBay earnings</span><b>${$(s.earn)}</b></div><div style="margin-top:6px" class="muted">You keep</div><div class="big" style="color:var(--accent)">${$(s.profit)}</div>${s===best?'<span class="pill posted">Best</span>':''}</div>`; });
  h += `</div><div class="card" style="margin-top:12px"><div style="font-weight:600">Business seller (later)</div><p class="muted" style="margin:4px 0 0">Enter eBay's monthly fee and flat postage rates to see how many sales a month make upgrading worth it. Rates are editable in More › Fee settings.</p></div></main>`;
  return h;
}

function vCodes() {
  let h = header('SKU codes');
  h += `<main><div class="insight">A SKU is <b>department + item type + number</b>. <b>WD-014</b> is the 14th women's dress. The prefix tells you which shelf or box to go to.</div>`;

  h += `<div class="card"><div style="font-weight:600;margin-bottom:6px">Item type</div><table class="t">${Object.entries(DB.codes).map(([t,c])=>`<tr><td style="width:40px;font-weight:600">${c}</td><td>${t}</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><div style="font-weight:600;margin-bottom:6px">Where each prefix is stored</div><table class="t">${Object.entries(DB.storage).map(([p,l])=>`<tr><td style="width:52px;font-weight:600">${p}${p.length===1?'…':''}</td><td>${esc(l)}</td></tr>`).join('')}</table><p class="muted" style="margin:8px 0 0">Editable in the real app as your storage grows.</p></div></main>`;

// ---------- sheets ----------
function sheet(html) { document.getElementById('overlay').innerHTML = `<div class="sheet-bg" data-action="closesheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; }
function closeSheet() { document.getElementById('overlay').innerHTML = ''; }
function lineSheet(tid, i) {
  const l = DB.trips.find(t=>t.id===tid).lines[i];
  let h = `<h3>${l.qty>1?l.qty+' × ':''}${esc(l.d)} · ${$(l.p)}</h3>`;

  if (l.item) h += `<button class="opt" data-action="item" data-id="${l.item}">${ic('items',20)} Open listed item</button>`;
  else h += `<button class="opt" data-action="makeitem" data-trip="${tid}" data-i="${i}">${ic('items',20)} Create item to list</button>`;

// ---------- render ----------
function render() {
  const t = cur();
  const views = { home:vHome, trips:vTrips, items:vItems, insights:vInsights, more:vMore };
  let html;
  switch (t.v) {
    case 'trip': html = vTrip(t.id); break;
    case 'item': html = vItem(t.id); break;
    case 'add': html = vAdd(t); break;
    case 'whatif': html = vWhatIf(t.id); break;
    case 'fees': html = vFees(); break;
    case 'shops': html = vSimpleList('Shops', DB.shops, 'shops'); break;
    case 'people': html = vSimpleList('People', DB.people, 'people'); break;
    case 'skucodes': html = vCodes(); break;
    case 'expenses': html = vExpenses(); break;
    case 'tax': html = vTax(); break;
    default: html = views[S.tab]();
  }
  document.getElementById('app').innerHTML = html;
  const tabs = [['home','Home'],['trips','Trips'],['items','Items'],['insights','Insights'],['more','More']];
  document.getElementById('tabbar').innerHTML = tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-action="tab" data-t="${k}" aria-label="${l}">${ic(k)}<span>${l}</span></button>`).join('');
  document.getElementById('fab').style.display = ['add','whatif','fees'].includes(t.v) ? 'none' : 'flex';
  bindInputs();
}
function bindInputs() {
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { S.q = e.target.value; document.getElementById('itemlist').innerHTML = itemsList(); });
  const tf = document.getElementById('typef');
  if (tf) tf.addEventListener('change', e => { S.typeF = e.target.value; document.getElementById('itemlist').innerHTML = itemsList(); });
  const wi = document.getElementById('wi-item');
  if (wi) wi.addEventListener('change', e => { S.whatIfItem = e.target.value; S.scen = null; S.stack[S.stack.length-1].id = e.target.value; render(); });
  document.querySelectorAll('[data-scen]').forEach(inp => inp.addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v)) { S.scen[e.target.dataset.scen] = v; render(); } }));
  document.querySelectorAll('[data-fee]').forEach(inp => inp.addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v)) { DB.fees[e.target.dataset.fee] = v; toast('Fee updated'); } }));
  const pin = document.getElementById('photoin');
  if (pin) pin.addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f); S.newPhoto = url; const box = document.getElementById('photobox'); box.innerHTML = `<img src="${url}" alt="">`; box.appendChild(pin); });
  const fp = document.getElementById('f-price'), fa = document.getElementById('f-ad');
  const prev = () => { const p = parseFloat(fp.value), r = parseFloat(fa.value); document.getElementById('pricepreview').innerHTML = isNaN(p) ? '' : `<div class="card" style="background:var(--accentSoft);border-color:transparent"><div class="kv"><span>You get about</span><span><b>${$(youGet(p, isNaN(r)?0:r))}</b></span></div><div class="kv"><span>Buyer sees about</span><span>${$(buyerSees(p))}</span></div><p class="muted" style="margin:6px 0 0">Buyer sees your price + buyer protection + ${$(DB.fees.label)} postage. You get your price minus the ${isNaN(r)?0:r}% ad.</p></div>`; };
  if (fp) { fp.addEventListener('input', prev); fa.addEventListener('input', prev); prev(); }
  const fs = document.getElementById('f-shop');
  if (fs) fs.addEventListener('change', () => { if (fs.value === 'My wardrobe') { document.getElementById('f-cost').value = 0; toast('From your wardrobe: cost $0'); } });
  ['f-dept','f-type'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('change', () => { const k = newSku(document.getElementById('f-dept').value, document.getElementById('f-type').value); document.getElementById('newsku').textContent = k; document.getElementById('newstore').textContent = 'Store in: ' + storageFor(k); }); });
  const ti = document.getElementById('f-title');
  if (ti) { const upd = () => document.getElementById('tcount').textContent = `(${ti.value.length}/80)`; ti.addEventListener('input', upd); upd(); }
}

    case 'saveexpense': { const a = parseFloat(document.getElementById('ex-a').value); const w = document.getElementById('ex-w').value.trim(); if (!isNaN(a) && w) { DB.expenses.push({ id:'e'+Date.now(), date:document.getElementById('ex-d').value || TODAY, what:w, cat:document.getElementById('ex-c').value, amt:a }); closeSheet(); if (cur().v !== 'expenses') go('expenses'); else render(); toast('Expense added'); } else toast('Enter what it was and the amount'); break; }
    case 'import': sheet(`<h3>Load your sales history</h3><button class="opt">From eBay <span class="sim">Phase 2</span></button><p class="muted" style="margin:-2px 2px 10px">Pulls past sales, fees and dates. eBay limits how far back the app can read, so older sales may need the next option.</p><button class="opt">From an eBay sales report or spreadsheet (CSV)</button><p class="muted" style="margin:-2px 2px 10px">Download a report from eBay Seller Hub, or use your own list. The app matches the columns.</p><button class="opt">Quick-add past items one by one</button><p class="muted" style="margin:-2px 2px 10px">For things only on receipts. Items from your own wardrobe are entered with a $0 cost.</p><button class="btn" data-action="closesheet2">Close</button>`); break;
    case 'splitline': { const t = DB.trips.find(x=>x.id===d.trip); const i = Number(d.i); const l = t.lines[i]; const each = Math.round(l.p / l.qty * 100) / 100; const parts = Array.from({length:l.qty}, (_, k) => ({ d: l.d.replace(/s$/, '') + ' ' + (k+1), p: each, s:'tolist' })); t.lines.splice(i, 1, ...parts); closeSheet(); render(); toast(`Split into ${parts.length} lines at ${$(each)} each`); break; }
    case 'relist': { const it = DB.items.find(x=>x.id===d.id); it.history = { sale: it.sale, refund: it.refund }; delete it.sale; it.tracking = null; it.status = 'listed'; it.listed = TODAY; S.itemTab = 'Listing'; render(); toast('Relisted · refund kept in history'); break; }

      const price = parseFloat(g('f-price'));
      const adRate = parseFloat(g('f-ad'));
      const it = { adRate: isNaN(adRate) ? DB.fees.adPct : adRate, id:'i'+n+'_'+Date.now(), sku:newSku(g('f-dept'), g('f-type')), title: g('f-title') ? g('f-title').replace(brand,'').trim().slice(0,40) || g('f-type') : g('f-type'), brand, dept:g('f-dept'), type:g('f-type'), size:g('f-size') || '—', colour:'—', condition:'', shop:g('f-shop').startsWith('+') ? null : g('f-shop'), cost: isNaN(cost) ? null : cost, listed: isNaN(price) ? null : g('f-listed'), listPrice: isNaN(price) ? null : price, status: isNaN(price) ? 'draft' : 'listed', trip: d.trip || null, description: g('f-desc') || '—', photo: S.newPhoto || null };
      DB.items.push(it);
      if (d.trip && d.line !== '') { const l = DB.trips.find(t=>t.id===d.trip).lines[Number(d.line)]; l.s = 'listed'; l.item = it.id; }
      S.stack.pop(); S.itemTab = 'Details'; go('item', {id:it.id}); toast(`Saved as ${it.sku}`);
      break; }
    case 'addcost': sheet(`<h3>What did you pay?</h3><div class="field"><label for="cost-in">Cost ($)</label><input id="cost-in" inputmode="decimal"></div><div class="field"><label for="cost-shop">Bought from</label><select id="cost-shop">${DB.shops.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><button class="btn" data-action="savecost" data-id="${d.id}">Save</button>`); break;
    case 'savecost': { const it = DB.items.find(x=>x.id===d.id); const v = parseFloat(document.getElementById('cost-in').value); if (!isNaN(v)) { it.cost = v; it.shop = document.getElementById('cost-shop').value; } closeSheet(); render(); break; }
    case 'post': { const it = DB.items.find(x=>x.id===d.id); it.tracking = '33LT' + Math.floor(100000+Math.random()*899999) + '01000931'; it.status = 'posted'; render(); toast('Marked as posted · tracking from eBay in phase 2'); break; }
    case 'marksold': { const it = DB.items.find(x=>x.id===d.id); const f = DB.fees; const price = it.listPrice; const postage = f.label; const prot = Math.round((f.protFixed + f.protPct/100*(price+postage))*100)/100; const ad = Math.round((it.adRate ?? f.adPct)/100*price*100)/100; it.sale = { date:TODAY, orderNo:'26-'+Math.floor(10000+Math.random()*89999)+'-'+Math.floor(10000+Math.random()*89999), price, postage, prot, ad, total: Math.round((price+postage+prot)*100)/100 }; it.status = 'sold'; S.itemTab = 'Sale'; render(); toast('Sold at list price (sample figures)'); break; }
    case 'addname': { const v = document.getElementById('newname').value.trim(); if (v) { (d.kind==='shops' ? DB.shops : DB.people).push(v); render(); toast('Added ' + v); } break; }
  }
});
render();
</script>
</body>
</html>
